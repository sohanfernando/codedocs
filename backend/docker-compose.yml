services:
  db:
    image: pgvector/pgvector:pg16
    container_name: codedocs-db
    environment:
      POSTGRES_DB: codedocs
      POSTGRES_USER: codedocs
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codedocs -d codedocs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: