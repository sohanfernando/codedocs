sonar.projectKey=sohanfernando_codedocs
sonar.organization=sohanfernando

# One project covering both halves of the monorepo, same as Automatic
# Analysis was already doing.
sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,frontend/public/**
sonar.sourceEncoding=UTF-8

# Java: compiled classes + JaCoCo report, so rules that need bytecode
# (not just source) run, and real coverage numbers show up instead of 0%.
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
