name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history, not a shallow clone — Sonar uses it to tell new
          # code from old and attribute issues to the right commit.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend build, test & coverage
        working-directory: backend
        # Testcontainers needs Postgres pulled/started for
        # CodedocsApplicationTests — Docker is preinstalled on this runner.
        # GEMINI_API_KEY/DB_PASSWORD just need to be non-blank for
        # @ConfigurationProperties validation; nothing here calls the real
        # Gemini API or the real database.
        run: ./mvnw -B verify
        env:
          DB_PASSWORD: test
          GEMINI_API_KEY: test-key

      - name: Frontend install, lint & build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
